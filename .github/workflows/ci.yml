name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/mutter-catalog-prep-r2-20260909
      - codex/mutter-web-stock-prep-20260928

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CATALOG_FRONTEND_SHA: f3bd9b6dc480afca3bcd7e2cf629671751a19cb3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify event checkout identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'event=%s\nref=%s\nexpected_sha=%s\nhead=%s\ntree=%s\n' "$EVENT_NAME" "$EVENT_REF" "$EXPECTED_SHA" "$actual_sha" "$actual_tree"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm

      - name: Install dependencies
        run: npm run install:controlled

      - name: Source repair and consumer regressions
        run: npm run test:braces

      - name: Real Busboy and Firebase multipart regressions
        run: npm run test:busboy

      - name: Typecheck
        run: npm run typecheck

      # Reuse the existing, lockfile-pinned emulator tooling from the paired frontend.
      # Its branch must be published safely before this workflow can resolve the commit.
      - name: Checkout exact catalog test harness
        uses: actions/checkout@v4
        with:
          repository: devrodri-com/mutter-games-dev
          ref: ${{ env.CATALOG_FRONTEND_SHA }}
          path: test-harness
          persist-credentials: false

      - name: Verify catalog harness identity
        working-directory: test-harness
        env:
          EXPECTED_SHA: ${{ env.CATALOG_FRONTEND_SHA }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'harness_expected_sha=%s\nharness_head=%s\nharness_tree=%s\n' "$EXPECTED_SHA" "$actual_sha" "$actual_tree"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Restore declared harness dependencies
        working-directory: test-harness
        run: node ../scripts/braces-remediation/install.cjs .

      - name: Setup Java for emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Catalog regression tests with real persistence and auth
        env:
          JAVA_TOOL_OPTIONS: -Duser.language=en -Duser.country=US
        run: >-
          node test-harness/node_modules/firebase-tools/lib/bin/firebase.js
          emulators:exec --only firestore,auth --project demo-mutter-r1
          --config test-harness/firebase.catalog-emulators.json "npm test"

      - name: Check Vercel function count
        run: npm run check:vercel-functions

      - name: Package every API function with the installed builder
        run: npm run check:packaging

      - name: Release gate positive and negative regressions
        run: npm run test:release-gate

      - name: Record actual build source and pair
        run: node scripts/release-gate/ci.cjs build admin "$RUNNER_TEMP/release-build"

      - name: Preserve build binding
        uses: actions/upload-artifact@v4
        with:
          name: release-build-admin-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-build
          if-no-files-found: error

  security:
    name: Security (${{ matrix.scope }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: [prod, all]
    steps:
      - name: security prerequisite 1
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify security target
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git show -s --format='head=%H tree=%T'
      - name: security prerequisite 3
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: security prerequisite 4
        run: npm run install:controlled
      - name: Native required dependency audit
        run: node scripts/release-gate/audit.cjs admin "${{ matrix.scope }}" "$RUNNER_TEMP/native-audit"

      - name: Preserve original native audit and exit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-audit-admin-${{ matrix.scope }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-audit
          if-no-files-found: error

  source-remediation:
    name: Source remediation (does not waive native audit)
    needs: [build, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: source-remediation prerequisite 1
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: source-remediation prerequisite 2
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Require actual compatibility gates
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
      - name: source-remediation prerequisite 4
        run: npm run install:controlled
      - name: source-remediation prerequisite 5
        run: npm run test:braces
      - name: source-remediation prerequisite 6
        uses: actions/download-artifact@v4
        with:
          pattern: native-audit-admin-*
          path: audit-input
      - name: Assess exact source against both original audit graphs
        run: |
          set -euo pipefail
          node scripts/braces-remediation/evaluate.cjs . audit-input/native-audit-admin-prod-${{ github.run_attempt }} prod
          node scripts/braces-remediation/evaluate.cjs . audit-input/native-audit-admin-all-${{ github.run_attempt }} all
          echo 'AUDITED_SOURCE_REPAIR_PRESERVED=YES; INDEPENDENT_RELEASE_GATE_AUDIT=PENDING; PRODUCTION_APPLICATION_AUTHORIZED=NO' >> "$GITHUB_STEP_SUMMARY"

      - name: Evaluate current security disposition
        env:
          RELEASE_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/release-gate/ci.cjs assess admin "$RUNNER_TEMP/release-assessment" audit-input

      - name: Preserve security disposition binding
        uses: actions/upload-artifact@v4
        with:
          name: release-assessment-admin-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-assessment
          if-no-files-found: error
