name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/mutter-catalog-prep-r2-20260909
      - codex/mutter-web-stock-prep-20260928

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CATALOG_FRONTEND_SHA: f3bd9b6dc480afca3bcd7e2cf629671751a19cb3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify event checkout identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'event=%s\nref=%s\nexpected_sha=%s\nhead=%s\ntree=%s\n' "$EVENT_NAME" "$EVENT_REF" "$EXPECTED_SHA" "$actual_sha" "$actual_tree"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Real Busboy and Firebase multipart regressions
        run: npm run test:busboy

      - name: Typecheck
        run: npm run typecheck

      # Reuse the existing, lockfile-pinned emulator tooling from the paired frontend.
      # Its branch must be published safely before this workflow can resolve the commit.
      - name: Checkout exact catalog test harness
        uses: actions/checkout@v4
        with:
          repository: devrodri-com/mutter-games-dev
          ref: ${{ env.CATALOG_FRONTEND_SHA }}
          path: test-harness
          persist-credentials: false

      - name: Verify catalog harness identity
        working-directory: test-harness
        env:
          EXPECTED_SHA: ${{ env.CATALOG_FRONTEND_SHA }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'harness_expected_sha=%s\nharness_head=%s\nharness_tree=%s\n' "$EXPECTED_SHA" "$actual_sha" "$actual_tree"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Restore declared harness dependencies
        working-directory: test-harness
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Setup Java for emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Catalog regression tests with real persistence and auth
        env:
          JAVA_TOOL_OPTIONS: -Duser.language=en -Duser.country=US
        run: >-
          node test-harness/node_modules/firebase-tools/lib/bin/firebase.js
          emulators:exec --only firestore,auth --project demo-mutter-r1
          --config test-harness/firebase.catalog-emulators.json "npm test"

      - name: Check Vercel function count
        run: npm run check:vercel-functions

      - name: Package every API function with the installed builder
        run: npm run check:packaging

  security:
    name: Security (${{ matrix.scope }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: [prod, all]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify security target
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git show -s --format='head=%H tree=%T'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Native required dependency audit
        run: npm run audit:${{ matrix.scope }}
